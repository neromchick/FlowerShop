version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowershop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowershop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src
      dockerfile: FlowerShop.WebAPI/Dockerfile
    container_name: flowershop-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-flowershop};Username=${POSTGRES_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY:-FlowerShopDevSecretKey_ChangeMe_InProduction_32chars!}
      - Jwt__Issuer=${JWT_ISSUER:-FlowerShop}
      - Jwt__Audience=${JWT_AUDIENCE:-FlowerShopClient}
      - Jwt__AccessTokenMinutes=${JWT_ACCESS_TOKEN_MINUTES:-30}
      - Jwt__RefreshTokenDays=${JWT_REFRESH_TOKEN_DAYS:-7}
      - Cors__Origins__0=${CORS_ORIGIN:-http://localhost:5173}
      - ASPNETCORE_ENVIRONMENT=${ENVIRONMENT:-Development}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/FlowerShop.WebAPI/wwwroot:/app/wwwroot
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowershop-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
